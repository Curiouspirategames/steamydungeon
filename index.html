<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steamy Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191430; --card:#2b2350; --card-b:#241d45; --well:#1c1738; --line:#463b78;
  --text:#f8f5ff; --muted:#c8bfea; --gold:#ffc94d; --coral:#ff6f7d; --mint:#58e6c6; --sky:#7cc4ff; --violet:#b48cff;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(255,150,60,.16), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(236,79,201,.14), transparent 60%),
    var(--bg);
  color:var(--text); font-family:'Nunito',system-ui,sans-serif; font-weight:600;
  font-size:17px; line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.fred{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:.2px}
h2{font-size:24px;margin:0 0 10px} h3{font-size:19px;margin:20px 0 10px;color:var(--gold)} h4{font-size:17px;margin:0}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.muted{color:var(--muted)} .hint{color:var(--muted);font-size:15px;margin:0 0 10px}
b.g,.g{color:var(--gold)} .c{color:var(--coral)} .m{color:var(--mint)} .s{color:var(--sky)} .v{color:var(--violet)}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(145deg,#ffd76a,#ff9a2e);box-shadow:0 4px 0 #b9641a,0 8px 20px rgba(0,0,0,.35);transform:rotate(-6deg)}
.brand h1{margin:0;font-size:30px;line-height:1.05}
.brand h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:15px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons & inputs */
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;
  background:#3a3070;color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;-webkit-tap-highlight-color:transparent;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(180deg,#ffd76a,#ffb22e);color:#3a2200;box-shadow:0 4px 0 #a8650f}
.btn.coral{background:linear-gradient(180deg,#ff8f9b,#ff5d6e);color:#2c0409;box-shadow:0 4px 0 #a72636}
.btn.mint{background:linear-gradient(180deg,#86f2da,#3fd3b0);color:#032b22;box-shadow:0 4px 0 #1d8a70}
.btn.violet{background:linear-gradient(180deg,#c9a8ff,#9a6bff);color:#1c0b3d;box-shadow:0 4px 0 #5b36b0}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(1px)}
.btn.sm{font-size:15px;padding:7px 12px;min-height:38px;border-radius:11px}
.btn.big{width:100%;font-size:21px;padding:14px 18px;min-height:56px}
.btn.full{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:none}
input[type=text],input[type=number],select,textarea{
  background:var(--well);border:2px solid var(--line);color:var(--text);border-radius:12px;padding:8px 12px;
  font:700 16px 'Nunito',sans-serif;min-height:44px;outline:none}
textarea{width:100%;min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=number]{-moz-appearance:textfield;width:90px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.card{background:linear-gradient(180deg,var(--card),var(--card-b));border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.card + .card{margin-top:18px}
.well{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:12px}
.pop{animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(-30px) scale(.5)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,201,77,.25),0 12px 32px rgba(0,0,0,.28)}}

/* setup */
.setup{max-width:720px;margin:0 auto}
.prow{background:var(--well);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.prow-top{display:flex;gap:8px;align-items:center}
.prow-top input{flex:1;min-width:0}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:620px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.wpick{background:#2b2350;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;color:var(--text);text-align:left;font:inherit;line-height:1.3}
.wpick .ic{font-size:26px}
.wpick b{font-family:'Fredoka';font-size:18px;display:block}
.wpick small{color:var(--muted);font-size:13px;display:block}
.wpick.on{border-color:var(--gold);background:linear-gradient(180deg,#3d3170,#2b2350);box-shadow:0 0 0 3px rgba(255,201,77,.25)}
.wpick:disabled{opacity:.35;cursor:not-allowed}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;background:var(--well);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--text);font:inherit;text-align:left;width:100%}
.opt.on{border-color:var(--gold)}
.opt .ic{font-size:26px;flex:none;width:34px;text-align:center}
.opt b{font-family:'Fredoka';font-size:18px}
.opt small{display:block;color:var(--muted);font-size:14px}

/* game layout */
.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:960px){.grid{grid-template-columns:minmax(420px,520px) 1fr;align-items:start}.col-l{position:sticky;top:12px}}
.col{display:grid;gap:18px;align-content:start}
.scenecard{padding:10px}
#scene{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;background:#000}
.map{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.node{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--well);border:2px solid var(--line);position:relative}
.node.done{opacity:.6}
.node.now{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.3);opacity:1;animation:bob 1.6s ease-in-out infinite}
.node.unk{color:var(--muted);font-family:'Fredoka';font-size:18px}
.node.boss{border-color:var(--coral)}
.link{width:10px;height:3px;background:var(--line);border-radius:2px}
.lastact{margin-top:10px;font-size:15px;color:var(--muted);text-align:center}
.lastact b{color:var(--text)}

/* step card */
.stepcard{border:2px solid var(--gold);animation:glow 2.4s ease-in-out infinite}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.steps div{text-align:center;font-family:'Fredoka';font-size:14px;padding:6px 4px;border-radius:10px;background:var(--well);border:1px solid var(--line);color:var(--muted)}
.steps div.on{background:linear-gradient(180deg,#ffd76a,#ffb22e);color:#3a2200;border-color:#ffb22e}
.steps div.past{color:var(--mint);border-color:#2b6b5d}
.stephead{font-family:'Fredoka';font-size:24px;margin:0 0 4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 auto}
.flavour{font-style:italic;color:#e7dcff;background:var(--well);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0}

/* units */
.units{display:grid;gap:10px}
@media(min-width:620px){.units.two{grid-template-columns:1fr 1fr}}
.unit{background:var(--well);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative}
.unit.down{opacity:.6;border-style:dashed}
.unit.dead{opacity:.45}
.unit-top{display:flex;align-items:center;gap:10px}
.unit-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;background:#2b2350}
.unit-name{font-family:'Fredoka';font-size:19px;line-height:1.1;flex:1}
.unit-name small{display:block;font-family:'Nunito';font-size:13px;color:var(--muted)}
.hp{position:relative;height:22px;background:#120e24;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2fbf71,#7df0a8);border-radius:99px;transition:width .6s cubic-bezier(.2,1.2,.4,1)}
.hp.foe i{background:linear-gradient(90deg,#ff5a64,#ff9a7a)}
.hp.boss i{background:linear-gradient(90deg,#8f3fd6,#ff5a9a)}
.hp span{position:relative;display:block;text-align:center;line-height:22px;font-family:'Fredoka';font-weight:600;font-size:14px;text-shadow:0 1px 3px #000}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:#2b2350;border:1px solid var(--line)}
.chip.weak{color:var(--gold);border-color:#7a6326}
.chip.res{color:var(--sky);border-color:#2f5a7a}
.chip.bad{color:var(--coral);border-color:#7a2f3a}
.chip.good{color:var(--mint);border-color:#2b6b5d}
.chip.mag{color:var(--violet);border-color:#5b3d8f}
.trait{font-size:14px;color:var(--muted);margin-top:6px}
.status{font-family:'Fredoka';font-size:14px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-wait{background:rgba(255,201,77,.15);color:var(--gold)}
.st-done{background:rgba(88,230,198,.15);color:var(--mint)}
.st-down{background:rgba(255,111,125,.15);color:var(--coral)}
.unit .btn{margin-top:10px}

/* doors */
.doors{display:grid;gap:12px}
@media(min-width:620px){.doors{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
.door{background:linear-gradient(180deg,#4a3326,#2e1f17);border:2px solid #7a5638;border-radius:60px 60px 16px 16px;padding:22px 14px 14px;text-align:center;cursor:pointer;color:var(--text);font:inherit;box-shadow:0 6px 0 #1a110c}
.door:active{transform:translateY(3px);box-shadow:0 2px 0 #1a110c}
.door .ic{font-size:40px;display:block}
.door b{font-family:'Fredoka';font-size:20px;display:block;margin:4px 0}
.door small{display:block;color:#f0dcc8;font-size:14px}
.door.boss{background:linear-gradient(180deg,#5a1f2a,#2e0f17);border-color:#b03a4f}

/* modals */
.modal{position:fixed;inset:0;background:rgba(10,6,25,.75);backdrop-filter:blur(4px);display:grid;place-items:center;padding:14px;z-index:40}
.modal-card{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--card),var(--card-b));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .3s ease both}
.modal-card.wide{max-width:760px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.modal-actions .btn{flex:1 1 auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mhead h2{margin:0}
.share-pre{background:#120e24;border:1px solid var(--line);border-radius:12px;padding:12px;font:600 14.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto;margin:0}
.gifbox{display:grid;place-items:center;min-height:120px;background:#120e24;border-radius:12px;overflow:hidden}
.gifbox img{max-width:100%;max-height:52vh;display:block}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:30px}
.gif-tip{color:var(--muted);font-size:14px;text-align:center;margin:10px 0 0}
.prog{height:10px;background:var(--well);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd76a,#ff9a2e)}

/* turn */
.act{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--well);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;color:var(--text);font:inherit;margin-top:10px}
.act:hover{border-color:#6b5bb0}
.act .ic{font-size:30px;width:40px;text-align:center;flex:none}
.act b{font-family:'Fredoka';font-size:20px;display:block;line-height:1.2}
.act .what{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.act .num{display:block;font-size:15px;margin-top:6px}
.act .num b,.act .what b{display:inline;font-family:inherit;font-size:inherit}
.act.hot{border-color:var(--gold)}
.act.spell{border-color:#5b3d8f;background:linear-gradient(180deg,#2a1d4f,#1c1738)}
.act:disabled{opacity:.4;cursor:not-allowed}
.stepnote{font-family:'Fredoka';color:var(--gold);font-size:15px;letter-spacing:.5px;text-transform:uppercase;margin:14px 0 2px}
.d20box{display:flex;justify-content:center;margin:16px 0}
.d20{width:120px;height:120px;display:grid;place-items:center;font-family:'Fredoka';font-weight:700;font-size:46px;color:#3a2200;
  background:linear-gradient(145deg,#ffe08a,#ffb22e);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.d20.spin2{animation:sp .3s linear infinite}
.fate{border-radius:14px;padding:12px;text-align:center;background:var(--well);border:2px solid var(--line)}
.fate b{font-family:'Fredoka';font-size:22px;display:block}
.fate.crit{border-color:var(--gold);background:linear-gradient(180deg,#4d3a0c,#2b2108)}
.fate.easy{border-color:var(--mint)} .fate.tough{border-color:#c98a3a} .fate.fumble{border-color:var(--coral)}
.task{text-align:center;background:linear-gradient(180deg,#3d3170,#2b2350);border:2px solid var(--gold);border-radius:18px;padding:16px;margin-top:12px}
.task .do{font-family:'Fredoka';font-size:38px;line-height:1.1;color:var(--gold);margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:'Fredoka';color:var(--gold);font-weight:600}
.results{display:grid;gap:8px}
.res{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{font-family:'Fredoka'}
.loot{display:grid;gap:10px}
.lootcard{display:flex;gap:12px;align-items:center;background:var(--well);border:2px solid var(--line);border-radius:16px;padding:12px}
.lootcard.win{border-color:var(--gold)}
.lootcard .ic{font-size:34px;width:44px;text-align:center}
.cfgsec{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
.cfgsec summary{font-family:'Fredoka';font-size:18px;cursor:pointer;padding:10px 0;color:var(--gold)}
.cfgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cfgrow label{flex:1;font-size:15px}
.cfgrow label small{display:block;color:var(--muted);font-size:13px}
.cfgrow input[type=text]{width:170px}
.cfgsub{font-family:'Fredoka';margin:12px 0 0;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#fff;color:#241d45;font-family:'Fredoka';font-weight:600;font-size:17px;padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.fab{position:fixed;right:14px;bottom:14px;z-index:30}
@media(min-width:960px){.fab{display:none}}
details.rules summary{cursor:pointer;font-family:'Fredoka';font-size:18px;color:var(--gold)}
.rules p{margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🏰</div>
      <div><h1>Sexy <span>Dungeon</span></h1><div class="sub" id="subTitle">An RPG turned horny</div></div>
    </div>
    <div class="hdr-actions" id="hdr"></div>
  </header>
  <main id="app"></main>
</div>
<button class="btn primary fab" id="fab" hidden data-a="info">🔍 Battlefield</button>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONSTANTS & META (descriptions; the numbers live in the editable config)
   ===================================================================== */
const DIV='━━━━━━━━━━━━━━━━━━━━━━';
const WMETA={
  Sword: {icon:'⚔️',fx:'slash',blurb:'Few actions, steady damage. A solid all-rounder.'},
  Mace:  {icon:'🔨',fx:'smash',blurb:'Lots of actions, smaller dice. Crushes Skeletons and Brutes.'},
  Dagger:{icon:'🗡️',fx:'stabs',blurb:'Quick snaps, small dice. Shreds Wizards and Bats.'},
  Bow:   {icon:'🏹',fx:'arrow',blurb:'The priciest action but hits hard. Picks off Goblins.'},
};
const WK=Object.keys(WMETA);
const MMETA={
  Goblin:  {icon:'👺',trait:'Sneaky: always attacks whoever has the lowest HP.'},
  Skeleton:{icon:'💀',trait:'Bony: takes half damage from the weapon it resists.'},
  Zombie:  {icon:'🧟',trait:'Slow: only attacks every other round (rounds 1, 3, 5…).'},
  Wizard:  {icon:'🧙',trait:'Arcane: its attacks go straight through Guard.'},
  Bat:     {icon:'🦇',trait:'Swift: attacks twice each round, but weakly.'},
  Brute:   {icon:'🐗',trait:'Elite: big, tough and hits hard.'},
  Mimic:   {icon:'📦',trait:'Ambush: it was pretending to be treasure!'},
};
const NORMAL_POOL=['Goblin','Skeleton','Zombie','Wizard','Bat'];
const BOSS_META={icon:'🐉',name:'The Dungeon Dragon',trait:'Boss: its weakness changes every round, and it gets angrier (more damage) when badly hurt.'};
const SMETA={
  Guard:    {icon:'🛡️',target:'guard', blurb:c=>`Protect one player (−${c.one} damage from every hit) or the whole party (−${c.all} each) until the enemies' next turn is over.`},
  Heal:     {icon:'💚',target:'player',blurb:c=>`Heal one player ${c.dice} HP. Can bring back someone who's down.`},
  Fireball: {icon:'🔥',target:'none',  blurb:c=>`${c.dice} damage to EVERY enemy.`},
  Lightning:{icon:'⚡',target:'enemy', blurb:c=>`${c.dice} damage to one enemy.`},
  Weaken:   {icon:'🌀',target:'enemy', blurb:c=>`One enemy's next attack does ${c.pct}% less damage.`},
};
const SK=Object.keys(SMETA);
const UMETA={
  sharpen:  {icon:'💪',name:'Whetstone',     desc:c=>`+${c.sharpen} damage on weapon attacks`},
  toughness:{icon:'❤️',name:'Hearty Meal',   desc:c=>`+${c.toughness} max HP (and heals it)`},
  potion:   {icon:'🧪',name:'Healing Potion',desc:c=>`Heals ${c.potion} HP right now`},
  stamina:  {icon:'💨',name:'Second Wind',   desc:c=>`Weapon attacks need ${c.stamina}% fewer actions`},
  keen:     {icon:'🍀',name:'Lucky Charm',   desc:c=>`+${c.keen} on every fate die roll`},
  scroll:   {icon:'📜',name:'Spell Scroll',  desc:()=>'Learn a random new spell'},
};
const RMETA={
  fight:   {icon:'⚔️',name:'Monster Lair',    desc:c=>`A fight against regular monsters. ${c.loot.chance>=100?'Everyone gets loot afterwards.':`Each player has a ${c.loot.chance}% chance of loot afterwards.`}`,
    flav:['Bones crunch underfoot as something stirs in the dark.','The torches gutter. Eyes glint from the shadows.','A foul smell drifts from the next chamber. You are not alone.','Chains rattle somewhere ahead. Then growling.']},
  elite:   {icon:'💀',name:'Elite Lair',      desc:c=>`A tougher fight with a Brute. ${c.loot.chance>=100?'Everyone gets TWO pieces of loot if you win.':'Everyone gets loot if you win.'}`,
    flav:['Heavy footsteps shake dust from the ceiling. Something BIG lives here.','A huge shape snorts in the gloom and lowers its head to charge.']},
  treasure:{icon:'💰',name:'Treasure Room',   desc:c=>`Free loot for everyone… unless it's a Mimic (${c.rooms.mimic}% chance).`,
    flav:['Gold glitters on a pedestal. It looks far too easy.','A chest sits alone in the middle of the room. Did it just… breathe?']},

const $=s=>document.querySelector(s);

const rnd=n=>Math.floor(Math.random()*n);

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function D(str){ const m=/^\s*(\d*)\s*d\s*(\d+)\s*(?:([+-])\s*(\d+))?\s*$/i.exec(String(str||'')); if(m) return {n:Math.max(1,+(m[1]||1)),s:Math.max(1,+m[2]),b:m[3]?(m[3]==='-'?-1:1)*+m[4]:0};
  const f=parseInt(str); return {n:0,s:1,b:isFinite(f)?f:0}; }
function dStr(d,extra=0){ const b=d.b+extra; return d.n?`${d.n}d${d.s}${b>0?'+'+b:b<0?b:''}`:`${b}`; }
function roll(d,extra=0){ const r=[]; for(let i=0;i<d.n;i++) r.push(1+rnd(d.s)); return {rolls:r,bonus:d.b+extra,total:Math.max(0,r.reduce((a,b)=>a+b,0)+d.b+extra)}; }
function rollText(r){ return '🎲 '+(r.rolls.length?r.rolls.join('+'):'')+(r.bonus?` ${r.bonus>0?'+':''}${r.bonus}`:'')+` = ${r.total}`; }
function dRange(d,extra=0){ return {lo:d.n+d.b+extra, hi:d.n*d.s+d.b+extra, avg:d.n*(d.s+1)/2+d.b+extra}; }
function dist(d,extra=0){ let p=new Map([[0,1]]); for(let i=0;i<d.n;i++){ const q=new Map(); for(const [v,pr] of p) for(let f=1;f<=d.s;f++) q.set(v+f,(q.get(v+f)||0)+pr/d.s); p=q; } const o=new Map(); for(const [v,pr] of p) o.set(Math.max(0,v+d.b+extra),(o.get(Math.max(0,v+d.b+extra))||0)+pr); return o; }
function killChance(d,extra,mult,hp){ let c=0; for(const [v,pr] of dist(d,extra)) if(Math.max(1,Math.round(v*mult))>=hp) c+=pr; return c; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2400); }

function wIcon(w){ return w&&WMETA[w]?`${WMETA[w].icon} ${w}`:'—'; }
function pIdx(p){ return S.players.indexOf(p); }
function spellsReady(p){ return (p.spells||[]).filter(k=>!(p.used||{})[k]); }
function taskCount(p,kind,fate){ const wc=C().weapons[p.weapon]; const base=kind==='quick'?+wc.quick:+wc.heavy;
  const st=Math.pow(1-(+C().loot.stamina||0)/100, p.stamina||0); return Math.max(1,Math.round(base*st*(fate?fate.mult:1))); }
function taskText(p,kind,fate){ const c=taskCount(p,kind,fate); return `${c} ${plural(p.weapon,c)}`; }
function spellCount(k,w){ const t=C().spells[k].tier==='big'?'big':'small'; return Math.max(1,Math.round(+C().spells.costs[t][w]||1)); }
function payText(k,w){ const c=spellCount(k,w); return `${c} ${plural(w,c)}`; }

function fateOf(raw,bonus){
  const F=C().fate, r=Math.min(20,raw+(bonus||0));
  if(raw===1) return {raw,r,k:'fumble',label:'FUMBLE!', emoji:'💀',mult:+F.fumble,dm:1,desc:`${F.fumble}× the actions!`};
  if(r>=20)   return {raw,r,k:'crit',  label:'CRITICAL!',emoji:'✨',mult:+F.crit,dm:+F.critDmg,desc:`${F.crit}× the actions AND ${F.critDmg}× damage`};
  if(r>=15)   return {raw,r,k:'easy',  label:'Lucky!',   emoji:'😏',mult:+F.easy,dm:1,desc:`${F.easy}× the actions`};

function startRun(){
  snap();
  const cfg=C(), hp=Math.max(1,+cfg.party.startHp||30);
  S.players=S.setup.players.slice(0,cfg.party.maxPlayers).map((p,i)=>({name:(p.name||'').trim()||`Player ${i+1}`,weapon:p.weapon,maxHp:hp,hp,
    sharp:0,stamina:0,keen:0,spells:[],used:{},items:[],down:false,acted:false,pending:null,fate:null,defending:false,guard:0}));
  S.mode=S.setup.mode; S.depth=0; S.path=[]; S.totalRounds=0; S.log=[]; S.extraEnemy=false; S.lossForfeit=null;
  addLog(`The party enters the dungeon: ${S.players.map(p=>`${p.name} (${p.weapon})`).join(', ')}.`);
  enterRoom('fight');
}
function genDoors(){
  const cfg=C();
  if(S.depth>=cfg.rooms.total) return ['boss'];
  const w=cfg.rooms.weights, FIGHTS=['fight','elite'];
  const last=S.path.length?S.path[S.path.length-1]:null, lastEasy=last&&!FIGHTS.includes(last.type)&&!(last.type==='treasure'&&S.room&&S.room.mimic);
  let types=Object.keys(w).filter(k=>+w[k]>0);
  if(cfg.rooms.noCoast&&lastEasy){ const f=types.filter(k=>FIGHTS.includes(k)); if(f.length) types=f; }
  const out=[]; const n=Math.max(1,Math.min(4,+cfg.rooms.doors||3));
  let guard=0;
  while(out.length<n&&guard++<200){
    let tot=types.reduce((a,k)=>a+(+w[k]),0), r=Math.random()*tot, t=types[0];
    for(const k of types){ r-=+w[k]; if(r<=0){t=k;break;} }
    if(!out.includes(t)||out.length>=types.length) out.push(t);
  }
  if(cfg.rooms.noCoast&&!out.some(t=>FIGHTS.includes(t))&&+w.fight>0) out[rnd(out.length)]='fight';
  return out;
}
function enterRoom(type){
  S.depth++; S.restedHere=false;
  const flav=pick(RMETA[type].flav);
  S.room={type,flav}; S.path.push({type});
  S.enemies=[]; S.round=1; S.roundEvents=[]; S.recap=null; S.lastAction=''; S.eventResult=null; S.loot=null;
  S.players.forEach(p=>{p.acted=false;p.pending=null;p.used={};p.defending=false;p.guard=0;p.fate=null;});
  if(type==='boss') S.depth=C().rooms.total+1;
  addLog(`${type==='boss'?'BOSS':`Room ${S.depth}`}: ${RMETA[type].name}. ${flav}`);
  if(type==='fight'||type==='elite'||type==='boss') return spawnFight(type);
  if(type==='treasure'){
    if(Math.random()*100<+C().rooms.mimic){ S.room.mimic=true; addLog('It was a MIMIC!'); return spawnFight('mimic'); }
    S.phase='loot'; S.loot={chance:100,results:null,reason:'The treasure is real! Everyone grabs something.'}; return;
  }
  if(type==='shrine'){
    const pct=+C().rooms.shrine, res=[];
    S.players.forEach(p=>{ const before=p.hp, wasDown=p.down; p.down=false; p.hp=Math.min(p.maxHp,Math.max(1,p.hp)+Math.ceil(p.maxHp*pct/100)); res.push({p:p.name,txt:`${wasDown?'got back up and ':''}healed ${p.hp-before} HP → ${p.hp}/${p.maxHp}`}); });
    S.eventResult={type,results:res}; S.phase='event'; addLog(`The shrine heals everyone ${pct}% of their max HP.`); return;
  }
  if(type==='trap'){
    const R=C().rooms, res=[];
    S.players.forEach(p=>{ const r=1+rnd(20), tot=Math.min(20,r+(p.keen||0)); if(tot<+R.trapDC){ const d=roll(D(R.trapDmg)); p.hp=Math.max(1,p.hp-d.total);
        res.push({p:p.name,bad:true,txt:`rolled ${r}${p.keen?` (+${p.keen} = ${tot})`:''}. Caught! −${d.total} HP (${p.hp}/${p.maxHp}).${C().forfeits.onHit?` Forfeit: ${R.trapForfeit}`:''}`}); }
      else res.push({p:p.name,txt:`rolled ${r}${p.keen?` (+${p.keen} = ${tot})`:''}. Dodged it!`}); });
    S.eventResult={type,results:res}; S.phase='event'; res.forEach(x=>addLog(`Trap: ${x.p} ${x.txt}`)); return;
  }
}
function spawnFight(kind){
  const cfg=C(), M=cfg.monsters, n=S.players.length, grow=(S.depth-1)*(+cfg.combat.hpGrowth||0);
  const mk=(t,i)=>{ const m=M[t]; const hp=Math.max(1,Math.round((+m.hp+grow)*diff().hp)); return {id:'e'+i,type:t,name:t,icon:MMETA[t].icon,hp,maxHp:hp,atk:m.atk,weak:m.weak,resist:m.resist,forfeit:m.forfeit,order:i+1,trait:MMETA[t].trait}; };
  if(kind==='boss'){
    const hp=Math.max(10,Math.round(n*(+cfg.boss.hpPer||30)*diff().hp));
    S.enemies=[{id:'b',type:'Boss',name:BOSS_META.name,icon:BOSS_META.icon,hp,maxHp:hp,atk:cfg.boss.atk,weak:null,resist:'',forfeit:cfg.boss.forfeit,order:1,trait:BOSS_META.trait,
      attacks:+cfg.boss.attacks>0?+cfg.boss.attacks:Math.max(1,Math.round(n/2))}];
    setBossWeak();
  } else {
    let list=[];
    let count=Math.min(Math.max(1,+cfg.combat.maxEnemies||99),Math.max(1,Math.round(n*(+cfg.combat.enemiesPerPlayer||1))))+(S.extraEnemy&&cfg.rest.extraEnemy?1:0);
    if(kind==='elite'){ list.push('Brute'); count--; }
    if(kind==='mimic'){ list.push('Mimic'); count=Math.max(0,count-2); }
    for(let i=0;i<count;i++) list.push(pick(NORMAL_POOL));
    S.enemies=list.map(mk);
    const seen={}, cnt={}; S.enemies.forEach(e=>seen[e.type]=(seen[e.type]||0)+1);
    S.enemies.forEach(e=>{ if(seen[e.type]>1){ cnt[e.type]=(cnt[e.type]||0)+1; e.name=`${e.type} ${cnt[e.type]}`; } });
  }
  S.extraEnemy=false;
  const sn=viewSnap();
  S.introEvent={k:'intro',d:2.8,pre:sn,post:sn,big:kind==='boss'?'BOSS FIGHT':kind==='mimic'?'MIMIC!':kind==='elite'?'ELITE LAIR':`ROOM ${S.depth}`,
    sub:S.enemies.map(e=>e.name).join(' · '),cap:S.room.flav,title:kind==='boss'?'BOSS FIGHT':`ROOM ${S.depth} OF ${C().rooms.total}`};
  S.phase='combat'; S.step='intro';
  queueAnim([S.introEvent]);
  addLog(`Enemies: ${S.enemies.map(e=>`${e.name} (${e.hp} HP)`).join(', ')}.`);
}
function lossText(){ const m=+C().forfeits.lossMult||1; return S.players.map(p=>{ const c=Math.max(1,Math.round(+C().weapons[p.weapon].heavy*m)); return `${p.name}: ${c} ${plural(p.weapon,c)}`; }).join(' · '); }
const DIFF={easy:{name:'Easy',icon:'🌱',hp:0.8,dmg:-1,desc:'Monsters have 20% less HP and hit 1 softer.'},normal:{name:'Normal',icon:'⚔️',hp:1,dmg:0,desc:'The standard numbers.'},hard:{name:'Hard',icon:'🔥',hp:1.3,dmg:1,desc:'Monsters have 30% more HP and hit 1 harder.'},brutal:{name:'Brutal',icon:'💀',hp:1.6,dmg:2,desc:'Monsters have 60% more HP and hit 2 harder. Good luck.'}};
function diff(){ return DIFF[C().combat.difficulty]||DIFF.normal; }
function setBossWeak(){ S.bossWeak=WK[(S.round-1)%WK.length]; }

function startRound(){
  snap();
  if(S.step==='share'){
    S.round++;
    if(isBossRoom()){ setBossWeak(); const rc=+C().boss.spellRecharge||0; if(rc>0&&(S.round-1)%rc===0) S.players.forEach(p=>p.used={}); }
  }
  S.players.forEach(p=>{ if(!p.down) p.acted=false; p.pending=null; p.defending=false; });

/* ---- player turns ---- */
function choose(i,kind){
  const p=S.players[i]; snap();
  if(kind==='defend'){ const pre=viewSnap(); p.defending=true; p.acted=true; p.pending=null;
    pushEv({k:'defend',a:hRef(p),t:[hRef(p)],nums:[],tags:['DEFENDING'],cap:`${p.name} raises their guard and defends`,d:1,pre,post:viewSnap()});
    S.lastAction=`${p.name} is defending (takes ${C().combat.defendPct}% less damage this round).`; addLog(S.lastAction); UI.turn=null; return; }
  p.pending={kind};
  if(kind==='spell'){ const r=spellsReady(p); if(r.length===1) chooseSpell(i,r[0],true); }
  if(kind==='quick'||kind==='heavy'){ const al=alive(); if(al.length===1) setTarget(i,al[0].id,true); }
}
function chooseSpell(i,k,noSnap){ if(!noSnap) snap(); const p=S.players[i]; p.pending.spell=k; const t=SMETA[k].target;
  if(t==='enemy'){ const al=alive(); if(al.length===1) p.pending.target=al[0].id; }
  if(t==='none') p.pending.target='all'; }
function setTarget(i,v,noSnap){ if(!noSnap) snap(); const p=S.players[i], pd=p.pending;
  if(pd.kind==='spell'&&pd.spell==='Guard'){ pd.target=v; return; }
  pd.target=v;
  if((pd.kind==='quick'||pd.kind==='heavy')&&!p.fate&&C().fate.on){ p.fate=fateOf(1+rnd(20),p.keen||0); startRoll(i); }
}
function needsTarget(p){ const pd=p.pending; if(!pd) return false;
  if(pd.kind==='quick'||pd.kind==='heavy') return pd.target==null;
  if(pd.kind==='spell') return pd.spell&&pd.target==null;
  if(pd.kind==='revive') return pd.target==null;
  return false; }
function needsPay(p){ const pd=p.pending; return !!(pd&&pd.kind==='spell'&&pd.spell&&!needsTarget(p)&&!pd.pay); }
let rollT=null, shufT=null;
function startRoll(i){ UI.rolling=i; clearTimeout(rollT); clearInterval(shufT);
  shufT=setInterval(()=>{ const d=$('#d20'); if(d) d.textContent=1+rnd(20); },70);
  rollT=setTimeout(()=>{ clearInterval(shufT); UI.rolling=null; render(); },1300); }

function resolve(i){
  const p=S.players[i], pd=p.pending; if(!pd) return; snap();
  if(pd.kind==='revive') resolveRevive(p);
  else if(pd.kind==='spell') resolveSpell(p);
  else resolveAttack(p);
  UI.turn=null;
  if(alive().length===0&&S.phase==='combat') roomCleared();
}
function resolveAttack(p){
  const pd=p.pending, kind=pd.kind;
  let e=S.enemies.find(x=>x.id===pd.target), redirect='';
  if(!e||e.hp<=0){ e=alive().sort((a,b)=>a.order-b.order)[0]; redirect=' (their target was already down, so it hit the next one)'; }
  if(!e) return;
  const fate=C().fate.on?(p.fate||fateOf(10,0)):fateOf(10,0);
  const pre=viewSnap(), d=wDice(p,kind), r=roll(d,p.sharp||0), m=multVs(e,p.weapon);
  const dmg=Math.max(1,Math.round(r.total*m*fate.dm));
  e.hp=Math.max(0,e.hp-dmg); const killed=e.hp<=0;
  const task=taskText(p,kind,fate);
  p.acted=true; p.pending=null; p.fate=null;
  const tags=[]; if(fate.k==='crit') tags.push('CRITICAL!'); if(m>1) tags.push(`WEAK ×${m}`); if(m<1) tags.push('RESISTED'); if(killed) tags.push('DEFEATED!');
  pushEv({k:'atk',fx:WMETA[p.weapon].fx,heavy:kind==='heavy',a:hRef(p),t:[eRef(e)],nums:[{ref:eRef(e),txt:`-${dmg}`,col:'#FF5A4A',big:fate.k==='crit'||kind==='heavy'}],tags,
    cap:`${p.name} ${kind==='heavy'?'HEAVY ':''}attacks ${e.name}: ${dmg} damage${killed?' — DEFEATED!':` (${e.hp} HP left)`}`,d:1.4,pre,post:viewSnap()});
  const enr=checkEnrage(e);
  S.lastAction=`${p.name} hit ${e.name} for ${dmg}${killed?'. Defeated!':`. ${e.name} has ${e.hp}/${e.maxHp} HP left.`}`;
  addLog(`${p.name}${C().fate.on?` rolled ${fate.raw} on the fate die${p.keen?` (+${p.keen})`:''} (${fate.label}),`:''} did ${task}: ${kind==='heavy'?'HEAVY ':''}attack on ${e.name}. ${rollText(r)}${m!==1?` ×${m} ${m>1?'weakness':'resisted'}`:''}${fate.dm>1?` ×${fate.dm} critical`:''} → ${dmg} damage${redirect}.${killed?` ${e.name} is DEFEATED!`:''}`);
  if(enr) addLog(enr);
}
function checkEnrage(e){
  if(e.type!=='Boss'||e.enraged||e.hp<=0) return null;
  if(e.hp<=e.maxHp*(+C().boss.enrageAt||50)/100){ e.enraged=true; const pre=viewSnap();
    pushEv({k:'enrage',a:eRef(e),t:[eRef(e)],nums:[],tags:['ENRAGED!'],cap:`${e.name} is ENRAGED! +${C().boss.enrageBonus} damage on every hit`,d:1.4,pre,post:viewSnap()});
    return `${e.name} is ENRAGED! Its attacks now do +${C().boss.enrageBonus} damage.`; }
  return null;
}
function resolveRevive(p){
  const t=S.players[p.pending.target], pre=viewSnap(), task=taskText(p,'heavy');
  if(t&&t.down){ t.down=false; t.hp=Math.max(1,Math.ceil(t.maxHp*(+C().combat.revivePct)/100)); t.acted=true; }
  p.acted=true; p.pending=null;
  pushEv({k:'revive',a:hRef(p),t:[hRef(t)],nums:[{ref:hRef(t),txt:`+${t.hp}`,col:'#5BD67A'}],tags:['REVIVED!'],cap:`${p.name} revives ${t.name}!`,d:1.4,pre,post:viewSnap()});
  S.lastAction=`${p.name} revived ${t.name} (${t.hp}/${t.maxHp} HP).`;
  addLog(`${p.name} did ${task} and revived ${t.name}, who is back on ${t.hp} HP.`);
}
function resolveSpell(p){
  const pd=p.pending, k=pd.spell, sc=C().spells[k], pre=viewSnap();
  const ev={k:'spell',sp:k,a:hRef(p),t:[],nums:[],tags:[],d:1.6}; let lg='';
  if(k==='Fireball'){ const parts=[];
    alive().forEach(e=>{ const r=roll(D(sc.dice)); e.hp=Math.max(0,e.hp-r.total); ev.t.push(eRef(e)); ev.nums.push({ref:eRef(e),txt:`-${r.total}`,col:'#FF8A2A'}); parts.push(`${e.name} −${r.total}${e.hp<=0?' (DEFEATED)':` (${e.hp} left)`}`); });
    ev.cap=`${p.name} casts FIREBALL on every enemy!`; lg=`${p.name} casts Fireball (paid with ${payText(k,pd.pay)}): ${parts.join(', ')}.`; S.lastAction=lg;
  } else if(k==='Lightning'){ let e=S.enemies.find(x=>x.id===pd.target); if(!e||e.hp<=0) e=alive()[0];
    const r=roll(D(sc.dice)); e.hp=Math.max(0,e.hp-r.total); ev.t=[eRef(e)]; ev.nums=[{ref:eRef(e),txt:`-${r.total}`,col:'#FFE14A',big:true}]; if(e.hp<=0) ev.tags.push('DEFEATED!');
    ev.cap=`${p.name} calls LIGHTNING on ${e.name}: ${r.total} damage!`; lg=`${p.name} casts Lightning (paid with ${payText(k,pd.pay)}) on ${e.name}: ${rollText(r)}.${e.hp<=0?` ${e.name} is DEFEATED!`:` ${e.hp}/${e.maxHp} HP left.`}`; S.lastAction=lg;
  } else if(k==='Heal'){ const t=S.players[pd.target], r=roll(D(sc.dice)), was=t.down;
    if(t.down){ t.down=false; t.hp=Math.min(t.maxHp,Math.max(1,r.total)); } else t.hp=Math.min(t.maxHp,t.hp+r.total);
    ev.t=[hRef(t)]; ev.nums=[{ref:hRef(t),txt:`+${r.total}`,col:'#5BD67A',big:true}]; if(was) ev.tags.push('REVIVED!');
    ev.cap=`${p.name} casts HEAL on ${t.name}: +${r.total} HP`; lg=`${p.name} casts Heal (paid with ${payText(k,pd.pay)}) on ${t.name}: ${rollText(r)}${was?', bringing them back up':''}. ${t.name}: ${t.hp}/${t.maxHp} HP.`; S.lastAction=lg;
  } else if(k==='Guard'){
    if(pd.target==='all'){ S.players.forEach(x=>{x.guard=(x.guard||0)+(+sc.all);}); ev.t=S.players.map(hRef); ev.tags=[`GUARD −${sc.all} ALL`]; ev.cap=`${p.name} casts GUARD on the whole party (−${sc.all} damage per hit)`; }
    else { const t=S.players[pd.target]; t.guard=(t.guard||0)+(+sc.one); ev.t=[hRef(t)]; ev.tags=[`GUARD −${sc.one}`]; ev.cap=`${p.name} casts GUARD on ${t.name} (−${sc.one} damage per hit)`; }
    lg=`${ev.cap} until the enemies' turn is over. Paid with ${payText(k,pd.pay)}.`; S.lastAction=ev.cap;
  } else if(k==='Weaken'){ let e=S.enemies.find(x=>x.id===pd.target); if(!e||e.hp<=0) e=alive()[0];
    e.weakened=true; ev.t=[eRef(e)]; ev.tags=['WEAKENED']; ev.cap=`${p.name} WEAKENS ${e.name}: its next attack does ${sc.pct}% less`; lg=`${ev.cap}. Paid with ${payText(k,pd.pay)}.`; S.lastAction=ev.cap;
  }
  p.used[k]=true; p.acted=true; p.pending=null;
  ev.pre=pre; ev.post=viewSnap(); pushEv(ev); addLog(lg);
  S.enemies.forEach(e=>{ const m=checkEnrage(e); if(m) addLog(m); });
}

/* ---- enemy turn ---- */
function enemyPhase(){
  snap();
  const evs=[], cfg=C();
  for(const e of alive().sort((a,b)=>a.order-b.order)){
    if(e.type==='Zombie'&&S.round%2===0){ const pre=viewSnap();
      evs.push({k:'skip',a:eRef(e),t:[],nums:[],tags:['TOO SLOW'],cap:`${e.name} shambles about too slowly to attack`,d:1,pre,post:viewSnap()}); addLog(`${e.name} is too slow to attack this round.`); continue; }
    const times=e.type==='Boss'?e.attacks:e.type==='Bat'?2:1;
    for(let k=0;k<times;k++){
      const L=living(); if(!L.length) break;
      const t=e.type==='Goblin'?L.slice().sort((a,b)=>a.hp-b.hp)[0]:pick(L);
      const pre=viewSnap(), r=roll(D(e.atk),(e.enraged?(+cfg.boss.enrageBonus||0):0)+diff().dmg);
      let dmg=r.total, notes=[];
      if(e.weakened){ dmg=Math.floor(dmg*(1-(+cfg.spells.Weaken.pct)/100)); notes.push('weakened'); }
      if(t.defending){ dmg=Math.floor(dmg*(1-(+cfg.combat.defendPct)/100)); notes.push('defended'); }
      if(t.guard&&e.type!=='Wizard'){ dmg=Math.max(0,dmg-t.guard); notes.push(`guard −${t.guard}`); }
      if(t.guard&&e.type==='Wizard') notes.push('arcane, ignores guard');
      t.hp=Math.max(0,t.hp-dmg); let down=false;
      if(t.hp<=0){ t.down=true; t.pending=null; down=true; }
      const ev={k:dmg===0?'block':'eatk',a:eRef(e),t:[hRef(t)],nums:dmg?[{ref:hRef(t),txt:`-${dmg}`,col:'#FF5A4A'}]:[],tags:down?['DOWN!']:dmg===0?['BLOCKED!']:[],
        cap:`${e.name} hits ${t.name} for ${dmg}${down?' — DOWN!':''}`,d:1.2,pre,post:viewSnap()};
      if(cfg.forfeits.onHit&&dmg>0) ev.ff={who:t.name,what:e.forfeit,from:e.name};
      evs.push(ev);
      addLog(`${e.name} attacks ${t.name}: ${rollText(r)}${notes.length?` (${notes.join(', ')})`:''} → ${dmg} damage. ${t.name}: ${t.hp}/${t.maxHp} HP${down?' — DOWN!':''}${ev.ff?` · Forfeit: ${e.forfeit}`:''}`);
    }
    e.weakened=false;
  }
  S.players.forEach(p=>{p.guard=0;});
  evs.forEach(ev=>{ ev.title=titleText(); S.roundEvents.push(ev); });
  S.totalRounds++;
  if(living().length===0){
    S.lossForfeit=lossText();
    const sn=viewSnap(); const le={k:'lose',d:2.8,pre:sn,post:sn,big:'DEFEATED',sub:'The party has fallen',cap:`Group forfeit: ${S.lossForfeit}`,title:titleText(),stay:true};
    S.roundEvents.push(le); evs.push(le); S.phase='lost'; addLog('The whole party is down. The run is over.');
  } else S.step='share';
  S.recap={title:titleText(),round:S.round,events:S.roundEvents.slice()};
  S.lastAction='';
  queueAnim(evs);
}

/* ---- room end ---- */
function roomCleared(){
  S.totalRounds++;
  const sn=viewSnap();
  if(isBossRoom()){
    S.phase='won';
    HOF.unshift({date:new Date().toISOString(),party:S.players.map(p=>`${p.name} (${p.weapon})`),rooms:C().rooms.total,rounds:S.totalRounds});
    if(HOF.length>50) HOF.length=50; store(KEY_HOF,HOF);
    pushEv({k:'win',d:3,pre:sn,post:sn,big:'VICTORY!',sub:'The Dungeon Dragon is slain',cap:`${C().rooms.total} rooms and the boss, in ${S.totalRounds} rounds`,stay:true});
    addLog('THE DRAGON IS SLAIN! Victory!');
  } else {
    pushEv({k:'clear',d:2.4,pre:sn,post:sn,big:'ROOM CLEARED',sub:roomLabel(),cap:'Time to check for loot',stay:true});
    S.players.forEach(p=>{ if(p.down){ p.down=false; p.hp=Math.max(1,Math.ceil(p.maxHp*(+C().combat.revivePct)/100)); addLog(`${p.name} gets back up with ${p.hp} HP.`);} p.pending=null; p.guard=0; p.defending=false; });
    const t=S.room.type, chance=(t==='elite'||S.room.mimic)?100:+C().loot.chance;
    S.loot={chance,results:null,reason:t==='elite'?'Elite room: everyone gets loot!':S.room.mimic?'The Mimic was guarding real treasure!':(chance>=100?'Everyone finds something!':`Each player has a ${chance}% chance of finding something.`)};
    S.phase='loot'; addLog(`${roomLabel()} cleared!`);
  }
  S.recap={title:titleText(),round:S.round,events:S.roundEvents.slice()};
  UI.turn=null;
}
function pickUpgrade(p){
  const L=C().loot, pool=Object.entries(L.pool).filter(([k,w])=>+w>0&&UMETA[k]);
  const allowed=pool.filter(([k])=>k!=='scroll'||(S.depth+1>=+C().spells.from&&(p.spells||[]).length<SK.length));
  let tot=allowed.reduce((a,[,w])=>a+(+w),0); if(!tot) return null;
  let r=Math.random()*tot; for(const [k,w] of allowed){ r-=+w; if(r<=0) return k; } return allowed[allowed.length-1][0];
}
function applyUpgrade(p,k){
  const L=C().loot;
  if(k==='sharpen'){ p.sharp=(p.sharp||0)+(+L.sharpen); return `+${L.sharpen} damage (now +${p.sharp})`; }
  if(k==='toughness'){ p.maxHp+=+L.toughness; p.hp+=+L.toughness; return `max HP ${p.maxHp}`; }
  if(k==='potion'){ const b=p.hp; p.hp=Math.min(p.maxHp,p.hp+(+L.potion)); return `healed ${p.hp-b} HP (${p.hp}/${p.maxHp})`; }
  if(k==='stamina'){ p.stamina=(p.stamina||0)+1; return `weapon actions now ${taskText(p,'quick')} / ${taskText(p,'heavy')}`; }
  if(k==='keen'){ p.keen=(p.keen||0)+(+L.keen); return `+${p.keen} on fate rolls`; }
  if(k==='scroll'){ const opts=SK.filter(s=>!p.spells.includes(s)); const s=pick(opts); p.spells.push(s); return `learned ${SMETA[s].icon} ${s}!`; }
  return '';
}
function rollLoot(){
  snap();
  const double=S.room&&S.room.type==='elite'&&+C().loot.chance>=100;
  S.loot.results=S.players.map(p=>{ const r=1+rnd(100); const ok=r<=S.loot.chance; let up=null,detail='';
    if(ok){ up=pickUpgrade(p); if(up) detail=applyUpgrade(p,up); if(double){ const u2=pickUpgrade(p); if(u2){ detail+=` + ${UMETA[u2].name}: ${applyUpgrade(p,u2)}`; } } }
    addLog(ok&&up?`${p.name} found ${UMETA[up].name}: ${detail}.`:`${p.name} found nothing (rolled ${r}).`);
    return {name:p.name,roll:r,ok:ok&&!!up,up,detail}; });
  S.loot.spells=grantSpells();
}
function grantSpells(){
  const out=[]; if(+C().spells.guaranteeAfter<=0||S.depth<+C().spells.guaranteeAfter) return out;
  S.players.forEach(p=>{ if(!(p.spells||[]).length){ const k=pick(SK); p.spells=[k]; out.push({name:p.name,spell:k}); addLog(`${p.name} learns ${k}!`); } });
  return out;
}
function afterRoom(){ snap(); const g=grantSpells(); g.forEach(x=>toast(`📜 ${x.name} learned ${x.spell}`)); S.phase='doors'; S.doors=genDoors(); }
function restLive(){ snap(); const pct=+C().rest.livePct; S.players.forEach(p=>{ p.down=false; p.hp=Math.min(p.maxHp,Math.max(1,p.hp)+Math.ceil(p.maxHp*pct/100)); });
  S.extraEnemy=!!C().rest.extraEnemy; S.restedHere=true; addLog(`The party rests and heals ${pct}% of max HP.${S.extraEnemy?' The next fight will have an extra enemy.':''}`); }
function restAsyncStart(){ snap(); S.restStart=Date.now(); S.phase='resting'; addLog('The party settles down to rest.'); }
function restGain(){ return Math.floor((Date.now()-S.restStart)/3600000*(+C().rest.asyncRate||1)); }
function restAsyncFinish(){ snap(); const g=restGain(); S.players.forEach(p=>{p.hp=Math.min(p.maxHp,p.hp+g);}); S.restStart=null; S.restedHere=true; S.phase='doors'; addLog(`Rest over: everyone healed up to ${g} HP.`); }
function chooseDoor(t){ snap(); enterRoom(t); }

const hpm=(v,t)=>{ const k=t?Math.round(clamp(v/t)*10):0; return '▰'.repeat(k)+'▱'.repeat(10-k); };
function partyLines(){ return S.players.map(p=>`${WMETA[p.weapon].icon} **${p.name}** ${p.down?'💤 DOWN':`${hpm(p.hp,p.maxHp)} ${p.hp}/${p.maxHp}`}`); }
function enemyLines(){ return alive().map(e=>`${e.icon} **${e.name}** ${hpm(e.hp,e.maxHp)} ${e.hp}/${e.maxHp} · weak: ${wIcon(weakOf(e))}${e.resist?` · resists: ${wIcon(e.resist)}`:''}`); }
function introText(){
  const L=[DIV,`🏰 **Sexy Dungeon · ${isBossRoom()?'BOSS FIGHT':`${RMETA[S.room.type].name} (room ${S.depth} of ${C().rooms.total})`}**`,'',`*${S.room.flav}*`,'','**You face:**'];
  S.enemies.forEach(e=>L.push(`${e.icon} **${e.name}** · ${e.maxHp} HP · hits for ${e.atk}`,`└ weak to ${wIcon(weakOf(e))}${e.resist?` · resists ${wIcon(e.resist)}`:''}`,`└ ${e.trait}`));
  L.push('','**Your turn!** Tell me: ⚔️ Quick attack, 💥 Heavy attack, 🛡️ Defend, or a ✨ spell — and who you\'re hitting.',DIV);
  return L.join('\n');
}
function callText(){
  const w=living().filter(p=>!p.acted);
  const L=[DIV,`⚔️ **${titleText()}**`,''];
  if(isBossRoom()) L.push(`🐉 The dragon is weak to **${wIcon(S.bossWeak)}** this round!`,'');
  L.push('**Enemies**',...enemyLines(),'','**Waiting on**');
  w.forEach(p=>{ const sp=spellsReady(p); L.push(`${WMETA[p.weapon].icon} **${p.name}** (${p.hp}/${p.maxHp} HP)`,`└ ⚔️ Quick: ~${taskText(p,'quick')} · 💥 Heavy: ~${taskText(p,'heavy')}${sp.length?` · ✨ ${sp.join(', ')}`:''}`); });
  L.push(DIV); return L.join('\n');
}
function recapText(){
  const R=S.recap; if(!R) return statusText();
  const L=[DIV,`📜 **${R.title} · Recap**`,''];
  R.events.forEach(e=>{ if(e.cap&&e.k!=='intro') L.push('• '+e.cap); });
  const ff=R.events.filter(e=>e.ff);
  if(ff.length){ L.push('','😈 **Forfeits to do**'); ff.forEach(e=>L.push(`• **${e.ff.who}**: ${e.ff.what} *(${e.ff.from})*`)); }
  L.push('','**Party**',...partyLines());
  if(S.phase==='combat'&&alive().length) L.push('','**Enemies**',...enemyLines());
  if(S.phase==='lost') L.push('',`💀 **Group forfeit:** ${S.lossForfeit}`);
  L.push(DIV); return L.join('\n');
}
function statusText(){
  const L=[DIV,`🏰 **Sexy Dungeon · ${S.phase==='won'?'🏆 VICTORY!':S.phase==='lost'?'💀 Defeated':roomLabel()}**`,'','**Party**',...partyLines()];
  if(S.phase==='combat'&&alive().length) L.push('','**Enemies**',...enemyLines());
  L.push(DIV); return L.join('\n');
}
function doorsText(){
  const L=[DIV,`🚪 **Choose a door!** (${S.depth>=C().rooms.total?'the boss awaits':`room ${S.depth+1} of ${C().rooms.total}`})`,''];
  S.doors.forEach((t,i)=>L.push(`**${i+1}.** ${RMETA[t].icon} **${RMETA[t].name}** — ${RMETA[t].desc(C())}`));
  L.push('','Vote in chat! 🗳️','','**Party**',...partyLines(),DIV); return L.join('\n');
}
function lootText(){
  const L=[DIV,`🎁 **Loot!** · ${roomLabel()}`,''];
  (S.loot.results||[]).forEach(r=>L.push(r.ok?`${UMETA[r.up].icon} **${r.name}** found **${UMETA[r.up].name}**: ${r.detail}`:`💨 **${r.name}** found nothing (rolled ${r.roll})`));
  if((S.loot.spells||[]).length){ L.push('','📜 **New spells!** (pay with any action)'); S.loot.spells.forEach(x=>L.push(`${SMETA[x.spell].icon} **${x.name}** learned **${x.spell}** — ${SMETA[x.spell].blurb(C().spells[x.spell])}`)); }
  L.push(DIV); return L.join('\n');
}
function eventText(){
  const ev=S.eventResult; const L=[DIV,`${RMETA[ev.type].icon} **${RMETA[ev.type].name}** · room ${S.depth} of ${C().rooms.total}`,'',`*${S.room.flav}*`,''];
  ev.results.forEach(r=>L.push(`${r.bad?'💥':'✅'} **${r.p}** ${r.txt}`)); L.push(DIV); return L.join('\n');
}
function taskCopy(i){
  const p=S.players[i], pd=p.pending; if(!pd) return '';
  const L=[DIV];
  if(pd.kind==='spell'){ L.push(`${SMETA[pd.spell].icon} **${p.name}** casts **${pd.spell}**`,`Do: **${payText(pd.spell,pd.pay)}**`); }
  else if(pd.kind==='revive') L.push(`💚 **${p.name}** revives **${S.players[pd.target].name}**`,`Do: **${taskText(p,'heavy')}**`);
  else { const f=p.fate, e=S.enemies.find(x=>x.id===pd.target); if(f&&C().fate.on) L.push(`🎲 **${p.name}** rolled **${f.raw}**${p.keen?` (+${p.keen})`:''} · ${f.emoji} **${f.label}**`); L.push(`${pd.kind==='heavy'?'💥 Heavy attack':'⚔️ Quick attack'} on **${e?e.name:'?'}**`,`Do: **${taskText(p,pd.kind,C().fate.on?f:null)}**`); }
  L.push(DIV); return L.join('\n');
}
function guideText(){
  const cfg=C(); const L=[DIV,'📖 **How to play Sexy Dungeon**','',
  'We\'re a party of adventurers fighting through a dungeon to slay a dragon. Every attack is paid for with actions. 😈','',
  '**Your weapon** decides which action you do:'];
  WK.forEach(w=>{ const wc=cfg.weapons[w]; L.push(`${WMETA[w].icon} **${w}** — ${wc.units}. Quick: ${wc.quick} (${wc.quickDice} dmg) · Heavy: ${wc.heavy} (${wc.heavyDice} dmg)`); });
  L.push('','**On your turn, pick one:**',
  '⚔️ **Quick attack** — a small number of actions for a small hit.',
  '💥 **Heavy attack** — more actions, but roughly double damage. Great for finishing enemies off.',
  '🛡️ **Defend** — no actions, but you take less damage this round.',
  '✨ **Spell** — found as random loot later on. You can pay for it with ANY action you like.','',
  '🎲 **The fate die** (d20) is rolled before you attack: 1 = double the actions 💀 · 2–6 = more · 7–14 = normal · 15–19 = half · 20 = half AND double damage ✨','',
  '**Weakness:** every monster is weak to one weapon (×2 damage), and some resist one (½ damage).',
  '**Enemy turn:** after everyone goes, each monster hits someone and they lose HP.',
  '**Down:** at 0 HP you\'re down. A teammate can revive you.',
  '**Between rooms** you vote on which door to take next. 🚪',DIV);
  return L.join('\n');
}

/* =====================================================================
   GIF (same encoder approach as the Dice Jar: median-cut palette, changed-area frames)
   ===================================================================== */
const LZT=new Int16Array(1<<20);
function lzw(px,minCode){
  const clear=1<<minCode, eoi=clear+1, out=[], used=[];
  let size=minCode+1, next=eoi+1, cur=0, bits=0;
  const emit=c=>{ cur|=c<<bits; bits+=size; while(bits>=8){ out.push(cur&255); cur>>>=8; bits-=8; } };
  const reset=()=>{ for(const k of used) LZT[k]=0; used.length=0; size=minCode+1; next=eoi+1; };
  emit(clear);
  let prefix=px[0];
  for(let i=1;i<px.length;i++){ const k=px[i], key=(prefix<<8)|k, c=LZT[key];
    if(c){ prefix=c; continue; }
    emit(prefix);
    if(next===4096){ emit(clear); reset(); }
    else { if(next>=(1<<size)) size++; LZT[key]=next++; used.push(key); }
    prefix=k; }
  emit(prefix); emit(eoi); if(bits>0) out.push(cur&255);
  reset(); return out;
}
function medianCut(hist,max){
  const cols=[]; for(let k=0;k<32768;k++) if(hist[k]) cols.push(k);
  const ch=(k,c)=>c===0?k>>10:c===1?(k>>5)&31:k&31;
  const avg=b=>{ let w=0,r=0,g=0,bl=0; for(const k of b){ const h=hist[k]; w+=h; r+=ch(k,0)*h; g+=ch(k,1)*h; bl+=ch(k,2)*h; } return [r/w*8.226|0,g/w*8.226|0,bl/w*8.226|0]; };
  if(cols.length<=max) return cols.map(k=>avg([k]));
  const boxes=[cols];
  while(boxes.length<max){
    let bi=-1,bs=-1,bch=0;
    boxes.forEach((b,i)=>{ if(b.length<2) return; let rng=0,c0=0,w=0;
      for(let c=0;c<3;c++){ let lo=99,hi=-1; for(const k of b){ const v=ch(k,c); if(v<lo)lo=v; if(v>hi)hi=v; } if(hi-lo>rng){ rng=hi-lo; c0=c; } }
      for(const k of b) w+=hist[k]; const sc=rng*Math.log2(2+w); if(sc>bs){ bs=sc; bi=i; bch=c0; } });
    if(bi<0) break;
    const b=boxes[bi].sort((x,y)=>ch(x,bch)-ch(y,bch));
    let tot=0; for(const k of b) tot+=hist[k];
    let acc=0,cut=1; for(let j=0;j<b.length-1;j++){ acc+=hist[b[j]]; if(acc>=tot/2){ cut=j+1; break; } cut=j+1; }
    boxes.splice(bi,1,b.slice(0,cut),b.slice(cut));
  }
  return boxes.map(avg);
}
function gifPlan(events,opts){
  const plan=[], first=events[0];
  if(opts.card) for(let k=0;k<10;k++) plan.push({snap:first.pre,big:opts.card,sub:opts.cardSub,title:first.title,k:'card'});
  events.forEach(ev=>{ const nf=Math.max(7,Math.round((ev.d||1.2)*10)); for(let k=0;k<nf;k++) plan.push({ev,p:k/nf}); });
  const last=events[events.length-1], tail=last.stay?18:8;
  for(let k=0;k<tail;k++) plan.push(last.stay?{snap:last.post,big:last.big,sub:last.sub,title:last.title,cap:last.cap,k:last.k}:{snap:last.post,title:last.title,cap:last.cap});
  return plan;
}
async function makeGif(events,opts,onProg){
  const W=LW, H=LH, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const plan=gifPlan(events,opts);
  // pass 1: palette from a sample of frames
  const hist=new Uint32Array(32768);
  for(let f=0;f<plan.length;f+=3){ drawScene(ctx,1,Object.assign({t:f/10},plan[f])); const d=ctx.getImageData(0,0,W,H).data; for(let i=0;i<d.length;i+=8) hist[((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3)]++; if(f%15===0){ onProg&&onProg(f/plan.length*0.3); await new Promise(r=>setTimeout(r,0)); } }
  const pal=medianCut(hist,256), map=new Int16Array(32768).fill(-1);
  const look=k=>{ let v=map[k]; if(v>=0) return v; const r=(k>>10)*8+4, g=((k>>5)&31)*8+4, b=(k&31)*8+4; let bd=1e9; for(let j=0;j<pal.length;j++){ const c=pal[j], dr=c[0]-r, dg=c[1]-g, db=c[2]-b, dd=2*dr*dr+4*dg*dg+3*db*db; if(dd<bd){ bd=dd; v=j; } } return map[k]=v; };
  const out=[], w16=v=>out.push(v&255,(v>>8)&255), str=s=>{ for(const c of s) out.push(c.charCodeAt(0)); };
  str('GIF89a'); w16(W); w16(H); out.push(0xF7,0,0);
  for(let j=0;j<256;j++){ const c=pal[j]||[0,0,0]; out.push(c[0],c[1],c[2]); }
  out.push(0x21,0xFF,11); str('NETSCAPE2.0'); out.push(3,1,0,0,0);
  let prev=null, pend=null;
  const flush=()=>{ if(!pend) return; const fr=pend, w=fr.x1-fr.x0+1, h=fr.y1-fr.y0+1, sub=new Uint8Array(w*h);
    for(let y=0;y<h;y++){ const s=(fr.y0+y)*W+fr.x0; sub.set(fr.f.subarray(s,s+w),y*w); }
    out.push(0x21,0xF9,4,4); w16(fr.delay); out.push(0,0);
    out.push(0x2C); w16(fr.x0); w16(fr.y0); w16(w); w16(h); out.push(0,8);
    const data=lzw(sub,8); for(let i=0;i<data.length;i+=255){ const n=Math.min(255,data.length-i); out.push(n); for(let j=0;j<n;j++) out.push(data[i+j]); } out.push(0); pend=null; };
  for(let f=0;f<plan.length;f++){
    drawScene(ctx,1,Object.assign({t:f/10},plan[f]));
    const d=ctx.getImageData(0,0,W,H).data, idx=new Uint8Array(W*H);
    for(let i=0,j=0;j<idx.length;i+=4,j++) idx[j]=look(((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3));
    const delay=f===plan.length-1?200:10;
    let x0=0,y0=0,x1=W-1,y1=H-1;
    if(prev){ x0=W;y0=H;x1=-1;y1=-1; for(let y=0;y<H;y++){ const r=y*W; for(let x=0;x<W;x++) if(idx[r+x]!==prev[r+x]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; y1=y; } }
      if(x1<0){ if(pend) pend.delay+=delay; continue; } }
    flush(); pend={f:idx,x0,y0,x1,y1,delay}; prev=idx;
    if(f%3===2){ onProg&&onProg(0.3+0.7*f/plan.length); await new Promise(r=>setTimeout(r,0)); }
  }

}

  h+=`<div class="modal-actions"><button class="btn" data-a="share" data-v="status">📋 Share status</button><button class="btn ghost" data-close>Close</button></div>`;

}
function rulesModal(){
  const cfg=C();
  openModal(`<div class="mhead"><h2>📖 How it works</h2><button class="btn sm ghost" data-close>Close</button></div><div class="rules">
  <p><b class="g">The idea.</b> The players are a party of up to ${cfg.party.maxPlayers} adventurers (with more than 4, weapons are shared) fighting through ${cfg.rooms.total} rooms to slay a dragon. Every attack is paid for with actions, which depend on their weapon. You, the host, run this app and post updates in Discord.</p>
  <p><b class="g">Each round of a fight:</b></p>
  <p>1️⃣ <b>Announce</b> what the party is facing (share the text or a GIF).<br>2️⃣ <b>Players' turns.</b> Each player tells you what they're doing. Tap their <b>Take turn</b> button and the app walks you through it: what they chose, the target, the fate die, and exactly what they have to do. Tap <b>Done</b> when they've done it, and the damage is rolled.<br>3️⃣ <b>Enemy turn.</b> When everyone has gone, tap <b>Enemies attack</b>. Each monster hits someone and they lose HP${C().forfeits.onHit?' (and owe its forfeit)':''}.<br>4️⃣ <b>Share</b> the round recap, then start the next round.</p>
  <p><b class="g">Player options:</b> ⚔️ Quick attack (few actions, small hit), 💥 Heavy attack (more actions, about double damage), 🛡️ Defend (no actions, ${cfg.combat.defendPct}% less damage this round), 💚 Revive a teammate who's down, or ✨ a spell once they've learned one.</p>
  <p><b class="g">Fate die:</b> attacks roll a d20 first. It can double, increase, halve or crit the amount.</p>
  <p><b class="g">Weakness:</b> each monster is weak to one weapon (×${cfg.combat.weakMult}) and some resist one (×${cfg.combat.resistMult}). Open 🔍 Battlefield any time to answer questions like "how much HP has it got?"</p>
  <p><b class="g">Loot (random):</b> ${cfg.loot.chance>=100?'after each fight, every player gets a <b>random</b> upgrade from the loot pool (two after an Elite Lair).':`after each fight, every player rolls a d100. If they roll ${cfg.loot.chance} or under, they get a <b>random</b> upgrade from the loot pool.`} Nobody starts with a spell, but everyone is given a random one after room ${cfg.spells.guaranteeAfter}. More can be found as Spell Scrolls.</p>
  <p><b class="g">Spells:</b> the spell itself is random, from a Spell Scroll, but the player chooses which action to pay for it with. Small spells cost about a quick attack (${spellCostText('Guard')}), big spells about double. Each spell can be used once per room (against the dragon, they recharge every ${cfg.boss.spellRecharge} rounds). Casting a spell is your turn.</p>
  <p><b class="g">Doors:</b> after each room, ${cfg.rooms.doors} random doors appear. The group votes on which one to take: monsters, an elite fight, treasure, a healing shrine or a trap. There's always at least one fight on offer${cfg.rooms.noCoast?', and after a non-fight room every door is a fight, so you can\'t coast':''}. After room ${cfg.rooms.total} comes the dragon.</p>
  <p><b class="g">Resting:</b> once between rooms. ${S.setup.mode==='async'?`Heals ${cfg.rest.asyncRate} HP per real hour.`:`Heals ${cfg.rest.livePct}% straight away${cfg.rest.extraEnemy?', but the next fight gets an extra enemy':''}.`}</p>
  <p><b class="g">Down:</b> at 0 HP a player is 💤 down. They skip their turns and monsters ignore them. A teammate can revive them by spending their turn (a heavy attack's worth of their own action), or with a Heal spell. If the room is won, everyone who's down gets back up with ${cfg.combat.revivePct}% HP.</p>
  <p><b class="g">Defeat:</b> if everyone is down at once, the run is over and each player owes ${cfg.forfeits.lossMult}× a heavy attack's worth of their own action.</p>
  <p><b class="g">Change anything</b> in ⚙️ Numbers, even mid-game.</p></div>
  <div class="modal-actions"><button class="btn primary" data-a="share" data-v="guide">📋 Share a player guide to Discord</button><button class="btn ghost" data-close>Close</button></div>`,true);
}

const WSEL=['','Sword','Mace','Dagger','Bow'];
function cfgField(path,label,type,hint,opts){
  const val=path.split('.').reduce((o,k)=>o[k],C());
  let inp;
  if(type==='bool') inp=`<button class="btn sm ${val?'mint':'ghost'}" data-a="cfgBool" data-v="${path}">${val?'On':'Off'}</button>`;
  else if(type==='sel') inp=`<select data-cfg="${path}" data-t="sel">${(opts||WSEL).map(o=>`<option value="${o}" ${o===val?'selected':''}>${o||'None'}</option>`).join('')}</select>`;
  else if(type==='lines') return `<div class="cfgrow" style="display:block"><label>${label}${hint?`<small>${hint}</small>`:''}</label><textarea data-cfg="${path}" data-t="text">${esc(val)}</textarea></div>`;
  else inp=`<input type="${type==='num'?'number':'text'}" ${type==='num'?'step="any"':''} data-cfg="${path}" data-t="${type}" value="${esc(val)}">`;
  return `<div class="cfgrow"><label>${label}${hint?`<small>${hint}</small>`:''}</label>${inp}</div>`;
}

function turnModal(){
  const i=UI.turn, p=S.players[i]; if(!p||S.phase!=='combat'){ UI.turn=null; return; }
  const pd=p.pending, cfg=C(), wc=cfg.weapons[p.weapon];
  let h=`<div class="mhead"><h2>${WMETA[p.weapon].icon} ${esc(p.name)}'s turn</h2><button class="btn sm ghost" data-a="closeTurn">✕</button></div>
    <div class="hp"><i style="width:${clamp(p.hp/p.maxHp)*100}%"></i><span>${p.hp} / ${p.maxHp} HP</span></div>`;
  const isAtk=pd&&(pd.kind==='quick'||pd.kind==='heavy');
  if(!pd){
    const q=dRange(wDice(p,'quick'),p.sharp), hv=dRange(wDice(p,'heavy'),p.sharp), sp=spellsReady(p), downs=S.players.filter((t,j)=>t.down&&j!==i);
    const fateNote=cfg.fate.on?' The fate die can change the amount.':'';

    <button class="act" data-a="choose" data-i="${i}" data-v="quick"><span class="ic">⚔️</span><span><b>Quick attack</b><span class="what">A fast, light hit on one enemy. Fewer actions, less damage.${fateNote}</span><span class="num">Do about <b class="g">${taskText(p,'quick')}</b> → deal <b class="g">${q.lo}–${q.hi}</b> damage (usually ~${Math.round(q.avg)})</span></span></button>
    <button class="act" data-a="choose" data-i="${i}" data-v="heavy"><span class="ic">💥</span><span><b>Heavy attack</b><span class="what">A big hit on one enemy. More actions, but roughly double the damage. Best for finishing something off or tough enemies.${fateNote}</span><span class="num">Do about <b class="g">${taskText(p,'heavy')}</b> → deal <b class="g">${hv.lo}–${hv.hi}</b> damage (usually ~${Math.round(hv.avg)})</span></span></button>
    <button class="act" data-a="choose" data-i="${i}" data-v="defend"><span class="ic">🛡️</span><span><b>Defend</b><span class="what">No actions this turn. ${esc(p.name)} braces and takes ${cfg.combat.defendPct}% less damage from enemy hits this round.</span></span></button>`;
    downs.forEach(t=>{ h+=`<button class="act hot" data-a="revive" data-i="${i}" data-j="${S.players.indexOf(t)}"><span class="ic">💚</span><span><b>Revive ${esc(t.name)}</b><span class="what">Help a fallen teammate back up. They return with ${cfg.combat.revivePct}% of their max HP.</span><span class="num">Do <b class="g">${taskText(p,'heavy')}</b></span></span></button>`; });
    if((p.spells||[]).length){ h+= sp.length?`<button class="act spell" data-a="choose" data-i="${i}" data-v="spell"><span class="ic">✨</span><span><b>Cast a spell</b><span class="what">Ready: ${sp.map(k=>`${SMETA[k].icon} ${k}`).join(', ')}. Spells cost their own action and can be used once per room.</span></span></button>`
      :`<button class="act spell" disabled><span class="ic">✨</span><span><b>Spells used up</b><span class="what">${isBossRoom()?`They recharge every ${cfg.boss.spellRecharge} rounds against the dragon.`:'They recharge in the next room.'}</span></span></button>`; }
    if(p.fate&&cfg.fate.on) h+=`<p class="hint" style="margin-top:12px">Fate die already rolled this turn: <b>${p.fate.raw}</b> (${p.fate.label}).</p>`;
  } else if(pd.kind==='spell'&&!pd.spell){
    h+=`<p class="stepnote">Step 2 · Which spell?</p>`;
    spellsReady(p).forEach(k=>{ const sc=cfg.spells[k]; h+=`<button class="act spell" data-a="spell" data-i="${i}" data-v="${k}"><span class="ic">${SMETA[k].icon}</span><span><b>${k}</b><span class="what">${SMETA[k].blurb(sc)}</span><span class="num">Pay with any action: <b class="g">${spellCostText(k)}</b></span></span></button>`; });
    h+=`<div class="modal-actions"><button class="btn ghost" data-a="cancel" data-i="${i}">← Back</button></div>`;
  } else if(needsTarget(p)){
    h+=`<p class="stepnote">Step 2 · Pick a target</p>`;
    if(pd.kind==='spell'&&pd.spell==='Guard'){ const sc=cfg.spells.Guard;
      h+=`<button class="act hot" data-a="target" data-i="${i}" data-v="all"><span class="ic">🛡️</span><span><b>The whole party</b><span class="what">Everyone takes ${sc.all} less damage from each hit this round.</span></span></button>`;
      S.players.forEach((t,j)=>{ if(!t.down) h+=`<button class="act" data-a="target" data-i="${i}" data-v="${j}"><span class="ic">${WMETA[t.weapon].icon}</span><span><b>${esc(t.name)}</b><span class="what">${t.hp}/${t.maxHp} HP · takes ${sc.one} less damage from each hit this round.</span></span></button>`; });
    } else if(pd.kind==='spell'&&pd.spell==='Heal'){
      S.players.forEach((t,j)=>{ h+=`<button class="act ${t.down?'hot':''}" data-a="target" data-i="${i}" data-v="${j}"><span class="ic">${WMETA[t.weapon].icon}</span><span><b>${esc(t.name)}</b><span class="what">${t.down?'DOWN: this will bring them back':`${t.hp}/${t.maxHp} HP`}</span></span></button>`; });
    } else {
      alive().sort((a,b)=>a.order-b.order).forEach(e=>{
        let line='', hot=false;
        if(isAtk){ const m=multVs(e,p.weapon), d=wDice(p,pd.kind), r=dRange(d,p.sharp), kc=killChance(d,p.sharp,m,e.hp);
          line=`<span class="num">${m>1?`<b class="g">WEAK to your ${p.weapon}: ×${m} damage!</b><br>`:m<1?`<b class="s">Resists your ${p.weapon}: ×${m} damage</b><br>`:''}Your hit: <b>${Math.max(1,Math.round(r.lo*m))}–${Math.max(1,Math.round(r.hi*m))}</b> damage · ${kc>=0.995?'<b class="m">will finish it off!</b>':kc>0?`<b class="m">${Math.round(kc*100)}% chance to finish it</b>`:'won\'t finish it this turn'}</span>`; hot=m>1; }
        else if(pd.spell==='Lightning'){ const kc=killChance(D(cfg.spells.Lightning.dice),0,1,e.hp); line=`<span class="num">${kc>0?`<b class="m">${Math.round(kc*100)}% chance to finish it</b>`:'won\'t finish it'}</span>`; }
        h+=`<button class="act ${hot?'hot':''}" data-a="target" data-i="${i}" data-v="${e.id}"><span class="ic">${e.icon}</span><span><b>${esc(e.name)}</b><span class="what">${e.hp}/${e.maxHp} HP · hits for ${esc(e.atk)}</span>${line}</span></button>`;
      });

  } else if(needsPay(p)){
    h+=`<p class="stepnote">Step 3 · How will ${esc(p.name)} pay for ${SMETA[pd.spell].icon} ${pd.spell}?</p><p class="hint">Spells can be paid for with any action, so pick whichever ${esc(p.name)} fancies.</p>`;
    WK.forEach(w=>{ h+=`<button class="act ${w===p.weapon?'hot':''}" data-a="pay" data-i="${i}" data-v="${w}"><span class="ic">${WMETA[w].icon}</span><span><b>${payText(pd.spell,w)}</b><span class="what">${w===p.weapon?'Their usual action':'Something different'}</span></span></button>`; });
    h+=`<div class="modal-actions"><button class="btn ghost" data-a="cancel" data-i="${i}">← Back</button></div>`;

    h+=`<p class="stepnote">Step 3 · Rolling the fate die…</p><div class="d20box"><div class="d20 spin2" id="d20">?</div></div><p class="hint" style="text-align:center">The fate die decides how many actions ${esc(p.name)} has to do.</p>`;
  } else {
    let doTxt, info='', fateHtml='';
    if(isAtk){
      const f=cfg.fate.on?p.fate:null, e=S.enemies.find(x=>x.id===pd.target), m=e?multVs(e,p.weapon):1, r=dRange(wDice(p,pd.kind),p.sharp), dm=f?f.dm:1;
      doTxt=taskText(p,pd.kind,f);
      if(f) fateHtml=`<div class="d20box" style="margin:10px 0"><div class="d20" style="width:84px;height:84px;font-size:32px">${f.raw}</div></div>
        <div class="fate ${f.k}"><b>${f.emoji} ${f.label}</b>${f.desc}${p.keen?` <span class="muted">(rolled ${f.raw} +${p.keen} Lucky Charm = ${f.r})</span>`:''}</div>`;
      info=`${pd.kind==='heavy'?'💥 Heavy attack':'⚔️ Quick attack'} on <b>${e?esc(e.name):'?'}</b> (${e?`${e.hp}/${e.maxHp} HP`:''})<br>Will deal <b class="g">${Math.max(1,Math.round(r.lo*m*dm))}–${Math.max(1,Math.round(r.hi*m*dm))}</b> damage${m>1?' <span class="g">(weakness!)</span>':m<1?' <span class="s">(resisted)</span>':''}${dm>1?' <span class="g">(critical!)</span>':''}`;
    } else if(pd.kind==='spell'){ const sc=cfg.spells[pd.spell];
      doTxt=payText(pd.spell,pd.pay);
      const tg=pd.spell==='Guard'?(pd.target==='all'?'the whole party':S.players[pd.target].name):pd.spell==='Heal'?S.players[pd.target].name:(pd.spell==='Lightning'||pd.spell==='Weaken')?(S.enemies.find(x=>x.id===pd.target)||{}).name:'every enemy';
