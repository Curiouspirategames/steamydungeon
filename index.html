    h+=`<p class="stepnote">${(isAtk&&cfg.fate.on)?'Step 3':pd.kind==='spell'?'Step 4':'Step 2'} · Do it!</p>${fateHtml}
      <div class="task"><div>${esc(p.name)}, do:</div><div class="do">${esc(doTxt)}</div><div>${info}</div></div>
      <div class="modal-actions"><button class="btn" data-a="copyTask" data-i="${i}">📋 Copy for Discord</button><button class="btn mint big" data-a="done" data-i="${i}">✅ Done! Roll it</button><button class="btn ghost" data-a="cancel" data-i="${i}">← Change action</button></div>`;
  }
  openModal(h);
}

/* =====================================================================
   RENDER
   ===================================================================== */
function renderHeader(){
  const inGame=S.phase!=='setup';
  $('#hdr').innerHTML=(inGame?`<button class="btn sm ghost" data-a="info">🔍 Battlefield</button>`:'')+
    `<button class="btn sm ghost" data-a="rules">📖 Rules</button><button class="btn sm ghost" data-a="cfg">⚙️ Numbers</button><button class="btn sm ghost" data-a="saveCode">💾 Save code</button>`+
    (inGame?`<button class="btn sm ghost" data-a="undo">↩ Undo</button><button class="btn sm ghost" data-a="newGame">↺ New game</button>`:'');
  $('#fab').hidden=!inGame;
  $('#subTitle').textContent=inGame?`${S.phase==='won'?'Victory!':S.phase==='lost'?'Defeated':S.phase==='doors'?'Between rooms':roomLabel()} · ${S.players.length} adventurer${S.players.length>1?'s':''}`:'An RPG turned horny';
}
function render(){
  renderHeader();
  $('#app').innerHTML=S.phase==='setup'?renderSetup():renderGame();
  save();
  if(UI.turn!=null) turnModal();
}
function renderSetup(){
  const cfg=C(), sp=S.setup, uniq=cfg.party.uniqueWeapons&&sp.players.length<=4;
  let h=`<div class="setup"><div class="card"><h2>⚔️ Assemble your party</h2><p class="hint">Up to ${cfg.party.maxPlayers} adventurers.${uniq?' Each takes a different weapon.':sp.players.length>4?' With more than 4 players, weapons can be shared.':''} Your weapon decides which action you do when you attack.</p>`;
  sp.players.forEach((p,i)=>{
    const taken=sp.players.filter((x,j)=>j!==i).map(x=>x.weapon);
    h+=`<div class="prow"><div class="prow-top"><div class="unit-ic" style="background:${PCOL[i%PCOL.length]}">${WMETA[p.weapon].icon}</div><input type="text" data-name="${i}" maxlength="20" placeholder="Player ${i+1} name" value="${esc(p.name)}">${sp.players.length>1?`<button class="btn sm ghost" data-a="rmPlayer" data-i="${i}">✕</button>`:''}</div>
      <div class="wgrid">${WK.map(w=>{ const wc=cfg.weapons[w]; const q=dRange(D(wc.quickDice)), hv=dRange(D(wc.heavyDice));
        return `<button class="wpick ${p.weapon===w?'on':''}" data-a="setWeapon" data-i="${i}" data-v="${w}" ${uniq&&taken.includes(w)?'disabled':''}><span class="ic">${WMETA[w].icon}</span><b>${w}</b><small><b style="font-size:13px;display:inline;font-family:Nunito">${wc.units}</b> · ${WMETA[w].blurb}</small><small>Quick: ${wc.quick} → ${q.lo}–${q.hi} dmg<br>Heavy: ${wc.heavy} → ${hv.lo}–${hv.hi} dmg</small></button>`; }).join('')}</div></div>`;
  });
  if(sp.players.length<cfg.party.maxPlayers) h+=`<button class="btn ghost full" data-a="addPlayer">＋ Add an adventurer</button>`;
  h+=`</div><div class="card"><h2>🗺️ The dungeon</h2><p class="hint">${cfg.rooms.total} rooms, then the dragon. After each room the group picks the next door. Change the length and everything else in ⚙️ Numbers.</p>
    <h3 style="margin-top:6px">Difficulty</h3><div class="opts">${Object.entries(DIFF).map(([k,d])=>`<button class="opt ${cfg.combat.difficulty===k?'on':''}" data-a="diff" data-v="${k}"><span class="ic">${d.icon}</span><span><b>${d.name}</b><small>${d.desc}</small></span></button>`).join('')}</div>
    <h3>How are you playing?</h3><div class="opts">
    <button class="opt ${sp.mode==='live'?'on':''}" data-a="mode" data-v="live"><span class="ic">🎙️</span><span><b>Live</b><small>In a VC or a busy chat, all in one go. Resting heals ${cfg.rest.livePct}% straight away.</small></span></button>
    <button class="opt ${sp.mode==='async'?'on':''}" data-a="mode" data-v="async"><span class="ic">🕰️</span><span><b>Spread out</b><small>Over hours or days. Resting heals ${cfg.rest.asyncRate} HP per real hour.</small></span></button></div>
    <div class="actions"><button class="btn" data-a="rules">📖 How it works</button><button class="btn" data-a="share" data-v="guide">📋 Player guide for Discord</button></div>
    <div class="start-wrap" style="margin-top:18px"><button class="btn primary big" data-a="start">🚪 Enter the dungeon</button></div></div>`;
  if(HOF.length) h+=`<div class="card"><h2>🏆 Hall of Fame</h2>${HOF.slice(0,8).map(r=>`<div class="res" style="margin-top:8px"><b>${esc(new Date(r.date).toLocaleDateString())}</b> · ${r.rooms} rooms + dragon in ${r.rounds} rounds<br><span class="muted">${esc(r.party.join(', '))}</span></div>`).join('')}</div>`;
  return h+'</div>';
}
function mapHtml(){
  const total=C().rooms.total; let h='<div class="map">';
  for(let k=1;k<=total;k++){ const node=S.path[k-1]; const now=k===S.depth&&S.phase!=='doors';
    h+=(k>1?'<span class="link"></span>':'')+(node?`<span class="node ${now?'now':'done'}" title="${RMETA[node.type].name}">${RMETA[node.type].icon}</span>`:`<span class="node unk ${S.phase==='doors'&&k===S.depth+1?'now':''}">?</span>`); }
  const bossNow=isBossRoom(); h+=`<span class="link"></span><span class="node boss ${bossNow?'now':''}">🐉</span></div>`;
  return h;
}
function renderGame(){
  const left=`<div class="col col-l"><div class="card scenecard"><canvas id="scene" width="960" height="540"></canvas>${mapHtml()}${S.lastAction&&S.phase==='combat'?`<div class="lastact">Last: <b>${esc(S.lastAction)}</b></div>`:''}</div>
    ${S.phase==='combat'?`<div class="card"><div class="mhead"><h2 style="font-size:20px">👹 Enemies</h2><button class="btn sm ghost" data-a="info">🔍 Full info</button></div><div class="units">${S.enemies.slice().sort((a,b)=>(a.hp<=0)-(b.hp<=0)||a.order-b.order).map(e=>enemyCard(e,false)).join('')}</div></div>`:''}</div>`;
  let right='<div class="col">';
  right+=renderStep();
  right+=`<div class="card"><h2 style="font-size:20px">🧙 The party</h2><div class="units two">${S.players.map((p,i)=>playerCard(p,i,true)).join('')}</div></div>`;
  right+=`<div class="card"><details class="rules"><summary>📜 Battle log</summary>${S.log.slice(0,60).map(l=>`<p style="font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px">${esc(l.text)}</p>`).join('')}</details></div>`;
  right+='</div>';
  return `<div class="grid">${left}${right}</div>`;
}
function stepper(cur){ const n=['Announce','Players','Enemies','Share']; return `<div class="steps">${n.map((x,k)=>`<div class="${k===cur?'on':k<cur?'past':''}">${k+1}. ${x}</div>`).join('')}</div>`; }
function renderStep(){
  const cfg=C();
  if(S.phase==='combat'){
    const waiting=living().filter(p=>!p.acted), cur=S.step==='intro'?0:S.step==='share'?3:(waiting.length?1:2);
    let h=`<div class="card stepcard">${stepper(cur)}`;
    if(cur===0){
      h+=`<p class="stephead">📣 ${isBossRoom()?'The dragon awakens!':S.room.mimic?'It\'s a Mimic!':`${RMETA[S.room.type].icon} ${RMETA[S.room.type].name}`}</p><div class="flavour">${esc(S.room.flav)}</div>
        <p>Tell the group what they're up against. The share text lists every enemy's HP, weakness and what it does.</p>
        <div class="actions"><button class="btn" data-a="share" data-v="intro">📋 Share text</button><button class="btn" data-a="gif" data-v="intro">🎞️ Make GIF</button></div>
        <div style="margin-top:12px"><button class="btn primary big" data-a="startRound">▶ Start round ${S.round}</button></div>`;
    } else if(cur===1){
      h+=`<p class="stephead">⚔️ Players' turns · Round ${S.round}</p>
        <p>Ask each player what they're doing, then tap their <b class="g">Take turn</b> button below. The app shows them exactly what to do.</p>
        <p class="muted">Waiting on: <b style="color:var(--text)">${esc(waiting.map(p=>p.name).join(', '))}</b></p>
        ${isBossRoom()?`<p>🐉 This round the dragon is <b class="g">weak to ${wIcon(S.bossWeak)}</b>.</p>`:''}
        <div class="actions"><button class="btn" data-a="share" data-v="call">📋 Share "your turn" message</button></div>`;
    } else if(cur===2){
      h+=`<p class="stephead">👹 Enemy turn</p><p>Everyone has gone. Time for the monsters to strike back. Each one picks a target${alive().some(e=>e.type==='Goblin')?' (Goblins go for whoever has the lowest HP)':''}.</p>
        <div style="margin-top:12px"><button class="btn coral big" data-a="enemyPhase">👹 Enemies attack!</button></div>`;
    } else {
      const ff=(S.recap?S.recap.events:[]).filter(e=>e.ff), hits=(S.recap?S.recap.events:[]).filter(e=>['eatk','block','skip'].includes(e.k));
      h+=`<p class="stephead">📣 Round ${S.round} results</p><div class="results">${hits.map(e=>`<div class="res">${esc(e.cap)}</div>`).join('')||'<div class="res">No enemy attacks this round.</div>'}</div>`;
      if(ff.length) h+=`<h3>😈 Forfeits to do</h3><div class="results">${ff.map(e=>`<div class="res"><b>${esc(e.ff.who)}</b>: ${esc(e.ff.what)} <span class="muted">(${esc(e.ff.from)})</span></div>`).join('')}</div>`;
      h+=`<div class="actions"><button class="btn" data-a="share" data-v="recap">📋 Share recap</button><button class="btn" data-a="gif" data-v="recap">🎞️ Make GIF</button></div>
        <div style="margin-top:12px"><button class="btn primary big" data-a="startRound">▶ Start round ${S.round+1}</button></div>`;
    }
    return h+'</div>';
  }
  if(S.phase==='loot'){
    let h=`<div class="card stepcard"><p class="stephead">🎁 Loot!</p><p>${esc(S.loot.reason)}</p>`;
    if(S.recap&&S.recap.events.length) h+=`<div class="actions"><button class="btn" data-a="share" data-v="recap">📋 Share final round</button><button class="btn" data-a="gif" data-v="recap">🎞️ Make GIF</button></div>`;
    if(!S.loot.results) h+=`<p class="hint" style="margin-top:12px">Every player rolls a d100. ${S.loot.chance>=100?'Everyone gets a <b>random</b> upgrade from the loot pool.':`Roll ${S.loot.chance} or under and you get a <b>random</b> upgrade from the loot pool.`}${S.depth+1>=+cfg.spells.from?' Spell Scrolls can now drop!':` Spell Scrolls start dropping from room ${cfg.spells.from}.`}</p><div style="margin-top:12px"><button class="btn primary big" data-a="rollLoot">🎲 Roll for loot</button></div>`;
    else { h+=`<div class="loot" style="margin-top:12px">${S.loot.results.map((r,k)=>`<div class="lootcard pop ${r.ok?'win':''}" style="animation-delay:${k*0.25}s"><span class="ic">${r.ok?UMETA[r.up].icon:'💨'}</span><span><b class="fred" style="font-size:18px">${esc(r.name)}</b> <span class="muted">rolled ${r.roll}</span><br>${r.ok?`Found <b class="g">${UMETA[r.up].name}</b>: ${esc(r.detail)}`:'Found nothing this time.'}</span></div>`).join('')}</div>
      ${(S.loot.spells||[]).length?`<h3>📜 New spells!</h3><p class="hint">Everyone gets a free spell after room ${C().spells.guaranteeAfter}. They can pay for it with any action.</p><div class="loot">${S.loot.spells.map((x,k)=>`<div class="lootcard pop win" style="animation-delay:${0.5+k*0.25}s"><span class="ic">${SMETA[x.spell].icon}</span><span><b class="fred" style="font-size:18px">${esc(x.name)}</b> learned <b class="g">${x.spell}</b><br><span class="muted">${esc(SMETA[x.spell].blurb(C().spells[x.spell]))}</span></span></div>`).join('')}</div>`:''}
      <div class="actions"><button class="btn" data-a="share" data-v="loot">📋 Share loot</button></div><div style="margin-top:12px"><button class="btn primary big" data-a="afterRoom">🚪 On to the doors</button></div>`; }
    return h+'</div>';
  }
  if(S.phase==='event'){
    const ev=S.eventResult;
    return `<div class="card stepcard"><p class="stephead">${RMETA[ev.type].icon} ${RMETA[ev.type].name}</p><div class="flavour">${esc(S.room.flav)}</div>
      <div class="results">${ev.results.map(r=>`<div class="res">${r.bad?'💥':'✅'} <b>${esc(r.p)}</b> ${esc(r.txt)}</div>`).join('')}</div>
      <div class="actions"><button class="btn" data-a="share" data-v="event">📋 Share</button></div><div style="margin-top:12px"><button class="btn primary big" data-a="afterRoom">🚪 On to the doors</button></div></div>`;
  }
  if(S.phase==='doors'){
    let h=`<div class="card stepcard"><p class="stephead">🚪 ${S.depth>=cfg.rooms.total?'The dragon awaits':'Choose a door'}</p><p>${S.depth>=cfg.rooms.total?'Only one way left. Rest up first if you need to.':`Share the doors, let the group vote in chat, then tap the winner. Next is room ${S.depth+1} of ${cfg.rooms.total}.`}</p>
      <div class="doors" style="margin-top:12px">${S.doors.map((t,k)=>`<button class="door ${t==='boss'?'boss':''}" data-a="door" data-v="${t}"><span class="ic">${RMETA[t].icon}</span><b>${k+1}. ${RMETA[t].name}</b><small>${esc(RMETA[t].desc(cfg))}</small></button>`).join('')}</div>
      <div class="actions"><button class="btn" data-a="share" data-v="doors">📋 Share the vote</button></div>`;
    if(!S.restedHere) h+=`<h3>😴 Rest first?</h3><p class="hint">You can rest once between rooms.</p>${S.mode==='async'?`<button class="btn mint full" data-a="restAsync">😴 Start resting (${cfg.rest.asyncRate} HP per hour)</button>`:`<button class="btn mint full" data-a="restLive">😴 Rest: everyone heals ${cfg.rest.livePct}%${cfg.rest.extraEnemy?' (next fight gets +1 enemy)':''}</button>`}`;
    else h+=`<p class="hint" style="margin-top:12px">✅ Rested.${S.extraEnemy?' The next fight will have an extra enemy.':''}</p>`;
    return h+'</div>';
  }
  if(S.phase==='resting'){
    const ms=Date.now()-S.restStart, hrs=Math.floor(ms/3600000), mins=Math.floor(ms%3600000/60000), g=restGain();
    return `<div class="card stepcard"><p class="stephead">😴 Resting</p><p>${hrs}h ${mins}m so far. Everyone will heal <b class="m">${g} HP</b> (${cfg.rest.asyncRate} per full hour).</p><div style="margin-top:12px"><button class="btn primary big" data-a="restFinish">Finish resting</button></div></div>`;
  }
  if(S.phase==='won'||S.phase==='lost'){
    const won=S.phase==='won';
    return `<div class="card stepcard"><p class="stephead">${won?'🏆 Victory!':'💀 The party has fallen'}</p>
      ${won?`<p>The Dungeon Dragon is slain! ${cfg.rooms.total} rooms and the boss in ${S.totalRounds} rounds. Added to the Hall of Fame.</p>`:`<p>Group forfeit:</p><div class="results">${S.lossForfeit.split(' · ').map(x=>`<div class="res"><b>${esc(x)}</b></div>`).join('')}</div><p class="hint" style="margin-top:8px">${C().forfeits.lossMult}× a heavy attack's worth of each player's own action.</p>`}
      <div class="actions"><button class="btn" data-a="share" data-v="recap">📋 Share</button><button class="btn" data-a="gif" data-v="recap">🎞️ Make GIF</button></div>
      <div style="margin-top:12px"><button class="btn primary big" data-a="newRun">⚔️ Start a new run</button></div></div>`;
  }
  return '';
}

/* =====================================================================
   SAVE CODES
   ===================================================================== */
function saveModal(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  openModal(`<h2>💾 Save code</h2><p class="hint">This code holds the whole game, including your custom numbers. Pin it in Discord or send it to another host, who can paste it in to carry on.</p>
    <textarea readonly id="codeOut" style="font-size:12px">${code}</textarea><p class="hint">${code.length} characters${code.length>1900?'. Too long for one Discord message, so use a notes app or DM it as a file.':''}</p>
    <div class="modal-actions"><button class="btn primary" id="mCopyCode">📋 Copy code</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="margin-top:0">Load a game</h3><textarea id="codeIn" placeholder="Paste a save code here"></textarea>
    <div class="modal-actions"><button class="btn" data-a="loadCode">Load it</button><button class="btn ghost" data-close>Close</button></div>`);
  $('#mCopyCode').onclick=async()=>{ const ok=await copyText(code); toast(ok?'✅ Save code copied':'Copy failed'); };
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a, i=+b.dataset.i, v=b.dataset.v;
  const reTurn=()=>{ render(); };
  switch(a){
    case 'info': return infoModal();
    case 'rules': return rulesModal();
    case 'cfg': return cfgModal();
    case 'saveCode': return saveModal();
    case 'share': { const m={intro:['📣 Announce the room',introText],call:['⚔️ Your turn',callText],recap:['📜 Round recap',recapText],status:['🔍 Status',statusText],doors:['🚪 Door vote',doorsText],loot:['🎁 Loot',lootText],event:['🗺️ Room result',eventText],guide:['📖 Player guide',guideText]}[v]; return shareModal(m[0],m[1]()); }
    case 'gif': return gifModal(v);
    case 'undo': if(UNDO.length){ S=JSON.parse(UNDO.pop()); clearAnim(); UI.turn=null; UI.rolling=null; closeModal(); toast('↩ Undone'); } else toast('Nothing to undo'); break;
    case 'newGame': return confirmModal('Start a new game?','This ends the current run. Your custom numbers are kept.','Start over',()=>{ snap(); const cfg=S.cfg, setup=S.setup; S=newState(cfg); S.setup=setup; clearAnim(); render(); });
    case 'newRun': { snap(); const cfg=S.cfg, setup=S.setup; S=newState(cfg); S.setup=setup; clearAnim(); break; }
    case 'loadCode': { const t=($('#codeIn').value||'').trim(); try{ const ns=JSON.parse(decodeURIComponent(escape(atob(t)))); if(!ns||(ns.v!==4&&ns.v!==5)) throw 0; ns.v=5; snap(); S=ns; S.cfg=deepMerge(defaultCfg(),S.cfg); clearAnim(); closeModal(); toast('✅ Game loaded'); }catch(e){ toast("That code didn't work"); return; } break; }
    case 'addPlayer': { const used=S.setup.players.map(p=>p.weapon); S.setup.players.push({name:'',weapon:WK.find(w=>!used.includes(w))||'Sword'}); break; }
    case 'rmPlayer': S.setup.players.splice(i,1); break;
    case 'setWeapon': S.setup.players[i].weapon=v; break;
    case 'mode': S.setup.mode=v; break;
    case 'diff': C().combat.difficulty=v; break;
    case 'start': startRun(); window.scrollTo(0,0); break;
    case 'startRound': startRound(); break;
    case 'enemyPhase': enemyPhase(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'openTurn': UI.turn=i; break;
    case 'closeTurn': UI.turn=null; $('#modal').hidden=true; break;
    case 'choose': choose(i,v); if(v==='defend'){ $('#modal').hidden=true; } break;
    case 'spell': chooseSpell(i,v); break;
    case 'pay': snap(); S.players[i].pending.pay=v; break;
    case 'revive': snap(); S.players[i].pending={kind:'revive',target:+b.dataset.j}; break;
    case 'target': { const p=S.players[i], pd=p.pending; const isP=pd.kind==='spell'&&(pd.spell==='Heal'||(pd.spell==='Guard'&&v!=='all')); setTarget(i,isP?+v:v); break; }
    case 'cancel': snap(); S.players[i].pending=null; break;
    case 'copyTask': { const ok=await copyText(taskCopy(i)); toast(ok?'✅ Copied! Paste it into Discord.':'Copy failed'); return; }
    case 'done': resolve(i); $('#modal').hidden=true; window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'rollLoot': rollLoot(); break;
    case 'afterRoom': afterRoom(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'door': chooseDoor(v); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'restLive': restLive(); break;
    case 'restAsync': restAsyncStart(); break;
    case 'restFinish': restAsyncFinish(); break;
    case 'cfgBool': { const cur=v.split('.').reduce((o,k)=>o[k],C()); setCfg(v,!cur); cfgModal(); render(); return; }
    case 'cfgReset': return confirmModal('Reset all numbers?','Everything in ⚙️ Numbers goes back to the defaults.','Reset',()=>{ S.cfg=defaultCfg(); store(KEY_CFG,{}); render(); toast('Numbers reset'); });
    case 'cfgSaveDefault': store(KEY_CFG,S.cfg); toast('⭐ New games will start with these numbers'); return;
    default: return;
  }
  render();
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.name!==undefined){ S.setup.players[+t.dataset.name].name=t.value; save(); } });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.cfg){ let v=t.value; if(t.dataset.t==='num'){ v=parseFloat(v); if(!isFinite(v)) v=0; } setCfg(t.dataset.cfg,v); if(S.phase!=='setup'||true){ const keep=$('#modalCard').scrollTop; const open=[...document.querySelectorAll('.cfgsec')].map(d=>d.open); renderBehind(); cfgModal(); document.querySelectorAll('.cfgsec').forEach((d,k)=>d.open=open[k]); $('#modalCard').scrollTop=keep; } } });
function renderBehind(){ renderHeader(); $('#app').innerHTML=S.phase==='setup'?renderSetup():renderGame(); save(); }
setInterval(()=>{ if(S.phase==='resting'&&$('#modal').hidden) render(); },30000);
if(S.phase==='combat'&&S.step==='intro'&&S.introEvent) queueAnim([S.introEvent]);
render();
</script>
